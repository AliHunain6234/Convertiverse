<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Word Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- docx is not on cdnjs (those links gave 404), so it is loaded from jsDelivr; it exposes window.docx -->
    <script src="https://cdn.jsdelivr.net/npm/docx@7.1.0/build/index.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(120deg, #f5f7fa, #dfe9f3);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background-color: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2192ff;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed #2192ff;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background-color: #f0f8ff;
            transition: 0.3s;
            margin-bottom: 30px;
        }

        .upload-area:hover, .upload-area.drag-over {
            border-color: #0d8bff;
            background-color: #e6f4ff;
        }

        #fileInput {
            display: none;
        }

        .upload-label {
            cursor: pointer;
        }

        .upload-icon {
            width: 60px;
            height: 60px;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .format-options, .quality-options {
            flex: 1;
            background-color: #f9fafe;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        h3 {
            color: #2c3e50;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .radio-group, label {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.95rem;
        }

        button {
            background-color: #2192ff;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0d6efd;
        }

        button:disabled {
            background-color: #b0c4de;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .preview-area {
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            background-color: #f4f6f9;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            font-size: 0.9rem;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #2192ff;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .note {
            font-size: 0.8rem;
            color: #667;
            margin-top: 12px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .options {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">&larr; Back to all tools</a>
    <h1>PDF to Word Converter</h1>
    <div class="upload-area" id="dropArea">
        <input type="file" id="fileInput" accept=".pdf">
        <label for="fileInput" class="upload-label">
            <img src="https://cdn-icons-png.flaticon.com/512/337/337946.png" class="upload-icon" alt="upload icon">
            <p>Click or drag your PDF file here to convert</p>
        </label>
    </div>
    <div class="options">
        <div class="format-options">
            <h3>Choose Format</h3>
            <div class="radio-group">
                <label><input type="radio" name="format" value="docx" checked> Word Document (.docx)</label>
                <label><input type="radio" name="format" value="txt"> Plain Text (.txt)</label>
                <label><input type="radio" name="format" value="html"> HTML (.html)</label>
            </div>
        </div>
        <div class="quality-options">
            <h3>Settings</h3>
            <label><input type="checkbox" id="preserveLayout" checked> Keep the PDF's line breaks</label>
        </div>
    </div>
    <button id="convertBtn" disabled>Convert PDF</button>
    <div id="status"></div>
    <div id="preview" class="preview-area"></div>
    <p class="note">Only the text of the PDF is converted (images are not). Scanned PDFs that contain only pictures have no text to extract.</p>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    document.addEventListener('DOMContentLoaded', () => {
        const fileInput = document.getElementById('fileInput');
        const dropArea = document.getElementById('dropArea');
        const convertBtn = document.getElementById('convertBtn');
        const statusDiv = document.getElementById('status');
        const previewDiv = document.getElementById('preview');
        let pdfFile = null;

        // More reliable PDF validation
        const validPDF = file => {
            if (!file) return false;
            // Check by file extension
            if (!file.name.toLowerCase().endsWith('.pdf')) return false;
            // Check by MIME type (but be lenient as this isn't always reliable)
            if (file.type && !file.type.includes('pdf') && file.type !== 'application/octet-stream') {
                return false;
            }
            return true;
        };

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, e => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.add('drag-over'));
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.remove('drag-over'));
        });

        dropArea.addEventListener('drop', e => {
            const files = e.dataTransfer.files;
            if (files.length > 0 && validPDF(files[0])) {
                handleFile(files[0]);
            } else {
                statusDiv.textContent = 'Please upload a valid PDF file.';
                statusDiv.style.color = '#e74c3c';
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0 && validPDF(fileInput.files[0])) {
                handleFile(fileInput.files[0]);
            } else {
                statusDiv.textContent = 'Please upload a valid PDF file.';
                statusDiv.style.color = '#e74c3c';
            }
        });

        function handleFile(file) {
            pdfFile = file;
            convertBtn.disabled = false;
            statusDiv.textContent = `Ready to convert: ${file.name}`;
            statusDiv.style.color = '#2192ff';
            previewDiv.style.display = 'none';
        }

   convertBtn.addEventListener('click', async () => {
    if (!pdfFile) return;

    const format = document.querySelector('input[name="format"]:checked').value;
    const preserveLayout = document.getElementById('preserveLayout').checked;

    statusDiv.textContent = 'Converting...';
    statusDiv.style.color = '#f39c12';

    try {
        const buffer = await pdfFile.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

        let fullText = '';

        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            // Group the text pieces into lines: a piece belongs to the current line while its
            // vertical position (transform[5]) stays about the same, otherwise a new line starts.
            const lines = [];
            let lastY = null;
            textContent.items.forEach(item => {
                if (!item.str) return;
                const y = item.transform ? item.transform[5] : 0;
                if (lines.length === 0 || lastY === null || Math.abs(y - lastY) > 3) {
                    lines.push(item.str);
                } else {
                    lines[lines.length - 1] += item.str;
                }
                lastY = y;
            });
            // "Keep line breaks" off: join the lines of a page into one flowing paragraph.
            const pageText = lines.join(preserveLayout ? '\n' : ' ').replace(/[ \t]+/g, ' ').trim();
            fullText += pageText + '\n\n';
        }

        if (!fullText.trim()) {
            throw new Error('No text found in this PDF (it may be a scanned document).');
        }

        previewDiv.textContent = fullText.substring(0, 1000) + (fullText.length > 1000 ? '...' : '');
        previewDiv.style.display = 'block';

        let blob, name = pdfFile.name.replace(/\.pdf$/i, '');

        if (format === 'txt') {
            blob = new Blob([fullText], { type: 'text/plain' });
            name += '.txt';
        } else if (format === 'html') {
            const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const html = fullText
                .split('\n\n')
                .filter(p => p.trim().length > 0)
                .map(p => `<p>${escapeHtml(p).replace(/\n/g, '<br>')}</p>`)
                .join('');
            const htmlContent = `<!DOCTYPE html><html><head><meta charset='UTF-8'></head><body>${html}</body></html>`;
            blob = new Blob([htmlContent], { type: 'text/html' });
            name += '.html';
        } else if (format === 'docx') {
            if (!window.docx) {
                throw new Error('The Word library could not be loaded. Check your internet connection and try again.');
            }
            // Use the docx reference from the global scope
            const { Document, Paragraph, TextRun, Packer } = window.docx;

            // Create paragraphs
            const paragraphs = fullText.split('\n\n')
                .filter(p => p.trim().length > 0)
                .map(text => new Paragraph({
                    // each line of the paragraph becomes a line break inside it
                    children: text.split('\n').map((line, n) => new TextRun({ text: line, break: n > 0 ? 1 : 0 }))
                }));
            
            const doc = new Document({
                sections: [{
                    properties: {},
                    children: paragraphs
                }]
            });

            // Generate and save the DOCX
            const docxBlob = await Packer.toBlob(doc);
            saveAs(docxBlob, name + '.docx');
            statusDiv.textContent = 'Conversion successful!';
            statusDiv.style.color = '#27ae60';
            return;
        }

        saveAs(blob, name);
        statusDiv.textContent = 'Conversion successful!';
        statusDiv.style.color = '#27ae60';
    } catch (error) {
        console.error(error);
        statusDiv.textContent = 'Error: ' + error.message;
        statusDiv.style.color = '#e74c3c';
    }
});
    });
</script>

</body>
</html>
