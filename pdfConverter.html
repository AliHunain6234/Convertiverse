<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text to PDF Converter</title>

  <!-- Internal CSS -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      /* the old Unsplash "source" background URL no longer exists, so a gradient is used */
      background: linear-gradient(135deg, #dfe9f3, #f5f7fa) fixed;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 15px;
      color: #3498db;
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    #hint {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
      text-align: right;
    }

    .container {
      max-width: 700px;
      margin: 80px auto;
      background-color: rgba(255, 255, 255, 0.95);
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 300px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      font-size: 18px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #2980b9;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: white;
      background-color: rgba(0, 0, 0, 0.7);
      position: fixed;
      width: 100%;
      bottom: 0;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .container {
        margin: 40px 20px;
        padding: 25px;
      }

      textarea {
        height: 250px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <a class="back-link" href="index.html">&larr; Back to all tools</a>
    <h1>📝 Text to PDF Converter</h1>
    <textarea id="textInput" placeholder="Write your document here..."></textarea>
    <div id="hint">0 characters</div>
    <button id="generateBtn">📥 Download as PDF</button>
  </div>

  <footer>
    &copy; 2025 | Class Project by Ali Hunain
  </footer>

  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Internal JavaScript -->
  <script>
    const textInput = document.getElementById("textInput");
    const hint = document.getElementById("hint");

    textInput.addEventListener("input", () => {
      hint.textContent = textInput.value.length.toLocaleString() + " characters";
    });

    document.getElementById("generateBtn").addEventListener("click", () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const text = textInput.value.trim();

      if (text === "") {
        alert("Please enter some text before downloading.");
        return;
      }

      const FONT_SIZE = 12;
      const LINE_HEIGHT = 6;          // mm between lines
      const MARGIN = 15;              // mm on every side
      const pageHeight = doc.internal.pageSize.getHeight();
      const pageWidth = doc.internal.pageSize.getWidth();

      doc.setFontSize(FONT_SIZE);
      const lines = doc.splitTextToSize(text, pageWidth - MARGIN * 2); // word wrap

      // jsPDF does not start a new page by itself: write line by line and add a page when one is full.
      let y = MARGIN + LINE_HEIGHT;
      lines.forEach(line => {
        if (y > pageHeight - MARGIN) {
          doc.addPage();
          y = MARGIN + LINE_HEIGHT;
        }
        doc.text(line, MARGIN, y);
        y += LINE_HEIGHT;
      });

      doc.save("your-document.pdf");
    });
  </script>
</body>
</html>
